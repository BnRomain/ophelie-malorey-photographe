name: Feature request
description: Suggest a new section, an interaction, an SEO improvement or better documentation.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - "Content and sections"
        - "Design and animations"
        - "Performance and accessibility"
        - "SEO, GEO and metadata"
        - "Tooling and CI"
        - "Documentation (README, wiki)"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or could be improved, and for which visitors?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you implement it, without adding a build tool or a framework?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you prefer this one.
